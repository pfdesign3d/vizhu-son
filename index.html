<!DOCTYPE html>

<head>

<title>&#8203;</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body { min-height: 100%; }
  body {
    display: flex; align-items: flex-start; justify-content: center;
    padding: 32px 16px;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(1200px 800px at 20% -10%, #2b1f4e 0%, #14101f 55%, #0b0812 100%);
    background-attachment: fixed;
    color: #cfc8e6;
  }
  .card {
    width: min(560px, 100%);
    padding: 34px 30px 26px;
    border-radius: 22px;
    background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    border: 1px solid rgba(255,255,255,.09);
    box-shadow: 0 30px 60px rgba(0,0,0,.5);
    backdrop-filter: blur(8px);
  }
  .head { display: flex; align-items: center; gap: 18px; margin-bottom: 26px; }
  .cover {
    width: 76px; height: 76px; flex-shrink: 0;
    border-radius: 50%;
    background: conic-gradient(from 210deg, #7c5cff, #4ea1ff, #7c5cff);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 30px rgba(124,92,255,.35);
    animation: spin 14s linear infinite;
    animation-play-state: paused;
  }
  .cover.playing { animation-play-state: running; }
  .cover .hole { width: 24px; height: 24px; border-radius: 50%; background: #14101f; border: 4px solid rgba(0,0,0,.35); }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 20px; font-weight: 600; line-height: 1.3; word-break: break-word; }
  .sub { margin-top: 6px; font-size: 12px; color: #9a93b8; }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .item {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 14px;
    border-radius: 14px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.06);
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .item:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.12); }
  .item.active { background: rgba(124,92,255,.14); border-color: rgba(124,92,255,.45); }
  .ico {
    width: 34px; height: 34px; flex-shrink: 0; border-radius: 50%;
    background: rgba(124,92,255,.16); border: 1px solid rgba(124,92,255,.4);
    display: flex; align-items: center; justify-content: center;
  }
  .item.active .ico { background: linear-gradient(145deg, #8a6bff, #5a8dff); border-color: transparent; }
  .ico svg { width: 15px; height: 15px; fill: #cfc8e6; }
  .item.active .ico svg { fill: #fff; }
  .meta { flex: 1; min-width: 0; }
  .name { font-size: 14px; line-height: 1.35; word-break: break-word; }
  .item.active .name { color: #e6e1f5; }
  .dur { font-size: 11.5px; color: #9a93b8; margin-top: 3px; line-height: 1.35; }
  .dur .genre { letter-spacing: .2px; }
  .dur .len { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .focus {
    display: flex; align-items: center; gap: 5px; flex-shrink: 0;
    font-size: 11px; letter-spacing: .2px; white-space: nowrap;
    color: #ffc978;
    background: rgba(255,201,120,.12);
    border: 1px solid rgba(255,201,120,.32);
    border-radius: 20px; padding: 4px 10px 4px 8px;
  }
  .focus svg { width: 12px; height: 12px; fill: #ffc978; }
  .item.focus-row { border-color: rgba(255,201,120,.28); }
  .item.focus-row.active { border-color: rgba(124,92,255,.45); }
  @media (max-width: 430px) { .focus span { display: none; } .focus { padding: 5px 7px; } }
  .spinner {
    width: 15px; height: 15px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.25); border-top-color: #cfc8e6;
    animation: rot .8s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }

  .bar { margin: 22px 0 6px; height: 14px; display: flex; align-items: center; cursor: pointer; }
  .bar .track { position: relative; height: 5px; width: 100%; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar .fill { position: absolute; inset: 0 100% 0 0; background: linear-gradient(90deg, #8a6bff, #4ea1ff); border-radius: 3px; }
  .time { display: flex; justify-content: space-between; font-size: 12px; color: #9a93b8; font-variant-numeric: tabular-nums; }
  .status { margin-top: 14px; font-size: 12px; color: #6f6893; text-align: center; min-height: 15px; }

  /* видеоклип */
  .vblock { display: none; margin-top: 26px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,.08); }
  .vblock.on { display: block; }
  .vtitle { font-size: 13px; color: #9a93b8; margin-bottom: 12px; display: flex; align-items: center; gap: 7px; }
  .vtitle svg { width: 14px; height: 14px; fill: #9a93b8; }
  .vwrap {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    border-radius: 14px; overflow: hidden;
    background: #0b0812 center/cover no-repeat;
    border: 1px solid rgba(255,255,255,.08);
  }
  .vwrap video { width: 100%; height: 100%; display: block; background: #000; }
  .vposter {
    position: absolute; inset: 0; cursor: pointer;
    background-size: cover; background-position: center;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .25s;
  }
  .vposter::after { content: ""; position: absolute; inset: 0; background: rgba(11,8,18,.35); }
  .vposter.hidden { opacity: 0; pointer-events: none; }
  .vbtn {
    position: relative; z-index: 1;
    width: 66px; height: 66px; border-radius: 50%;
    background: linear-gradient(145deg, #8a6bff, #5a8dff);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 30px rgba(110,100,255,.45);
    transition: transform .12s;
  }
  .vposter:hover .vbtn { transform: scale(1.07); }
  .vbtn svg { width: 26px; height: 26px; fill: #fff; margin-left: 4px; }
  .vload { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.1); }
  .vload .vfill { height: 100%; width: 0; background: linear-gradient(90deg, #8a6bff, #4ea1ff); transition: width .2s; }
  .vnote { margin-top: 10px; font-size: 12px; color: #6f6893; text-align: center; min-height: 15px; }
</style>

  var META = {"album":"ESeb3YiTNS5sI6TkIvX1vEkczKjESlloJCArVcEq0WPRT78FOHUUFe7z","subtitle":"kdQ+CXh1i8EjhlZfvOf/srlxiMhaSlhpGCAgVPTauMTQf74wOUgUFu/JlfpS9LWVMNfo51TFA26Dd6k="};

  function dec(b64) {

    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    var s = 0x5EED1F;
    for (var j = 0; j < arr.length; j++) {

      s = (s ^ (s >>> 17)) >>> 0;
      s = (s ^ (s << 5)) >>> 0;
      arr[j] ^= (s & 0xFF);
    }
    return decodeURIComponent(escape(String.fromCharCode.apply(null, arr)));
  }

  function decodeStream(data, seed) {
    var s = seed >>> 0;
    for (var i = 0; i < data.length; i++) {
      s = (s ^ (s << 13)) >>> 0;
      s = (s ^ (s >>> 17)) >>> 0;
      s = (s ^ (s << 5)) >>> 0;
      data[i] ^= (s & 0xFF);

  function render() {

    var pos = playing && ctx ? Math.min(ctx.currentTime - startedAt, buf ? buf.duration : 0) : offset;

  function load(i) {

    status.textContent = 'Загрузка…';
    var reqs = [];
    for (var k = 0; k < t.count; k++) {

    function fetchChunk(k) {

            delete received[nextToAppend];
            nextToAppend++;
            try { sb.appendBuffer(chunk); } catch (e) { onStreamFail(); return; }
          } else if (appended >= VIDEO.count && ms.readyState === 'open') {
            try { ms.endOfStream(); } catch (e) {}
          }
        }

        sb.addEventListener('updateend', function () {
          appended++;
          vfill.style.width = Math.round(appended / VIDEO.count * 100) + '%';
          if (appended >= VIDEO.count) {
            if (ms.readyState === 'open') { try { ms.endOfStream(); } catch (e) {} }
            vnote.textContent = '';
            return;
          }
          pumpAppend();
        });

        function pumpFetch() {
          if (failed) return;
          while (fetched < VIDEO.count && (fetched - nextToAppend) < PARALLEL) {
            (function (k) {
              fetchChunk(k).then(function (arr) {
                if (failed) return;
                received[k] = arr;
                pumpAppend();
                pumpFetch();
              }).catch(function () { if (!failed) vnote.textContent = 'Не удалось загрузить видео'; });
            })(fetched);
            fetched++;
          }
        }

        vnote.textContent = 'Загрузка клипа…';
        pumpFetch();
        video.play().catch(function () {});
      });
    }

    // запасной путь (Safari на iPhone): скачиваем целиком, потом играем
    function blobFallback() {
      vnote.textContent = 'Загрузка клипа… 0%';
      var parts = new Array(VIDEO.count);
      var done = 0;
      var chain = Promise.resolve();
      for (var k = 0; k < VIDEO.count; k++) {
        (function (idx) {
          chain = chain.then(function () {
            return fetchChunk(idx).then(function (arr) {
              parts[idx] = arr;
              done++;
              var pct = Math.round(done / VIDEO.count * 100);
              vfill.style.width = pct + '%';
              vnote.textContent = 'Загрузка клипа… ' + pct + '%';
            });
          });
        })(k);
      }
      chain.then(function () {
        var blob = new Blob(parts, { type: 'video/mp4' });
        video.src = URL.createObjectURL(blob);
        vnote.textContent = '';
        video.play().catch(function () {});
      }).catch(function () { vnote.textContent = 'Не удалось загрузить видео'; });
    }
  }
})();
</script>
